<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Arun Urban Homes | Premium Interior Design</title>

  <meta
    name="description"
    content="Arun Urban Homes creates refined, contemporary interiors designed around the way you live."
  >

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link
    href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@500;600;700&display=swap"
    rel="stylesheet"
  >

  <style>

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      font-family: "DM Sans", sans-serif;
      color: #24221f;
      background: #f8f5ef;
      line-height: 1.6;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    img {
      max-width: 100%;
      display: block;
    }

    /* =========================
       HEADER
    ========================= */

    header {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 108px;
      z-index: 1000;

      background: rgba(250, 247, 240, 0.97);

      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);

      border-top: 2px solid #c7a15a;
      border-bottom: 1px solid rgba(183, 148, 75, 0.28);
    }

    nav {
      width: 88%;
      max-width: 1500px;
      height: 100%;
      margin: auto;

      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 30px;
    }

    /* =========================
       LOGO
    ========================= */

    .logo {
      width: 190px;
      height: 100px;

      display: flex;
      align-items: center;
      justify-content: flex-start;

      overflow: visible;
      flex-shrink: 0;
    }

    .logo img {
      width: 170px;
      height: 92px;

      object-fit: contain;
      object-position: center;

      display: block;

      transform: none;

      mix-blend-mode: multiply;

      transition: transform 0.4s ease;
    }

    .logo:hover img {
      transform: scale(1.03);
    }

    /* =========================
       NAVIGATION
    ========================= */

    .nav-links {
      display: flex;
      align-items: center;
      justify-content: center;

      gap: 42px;

      list-style: none;

      margin-left: auto;
      margin-right: auto;
    }

    .nav-links a {
      position: relative;

      font-size: 11px;
      font-weight: 600;

      letter-spacing: 1.8px;
      text-transform: uppercase;

      color: #4b4740;

      transition: color 0.3s ease;
    }

    .nav-links a::after {
      content: "";

      position: absolute;
      left: 0;
      bottom: -8px;

      width: 0;
      height: 1px;

      background: #b88a36;

      transition: width 0.3s ease;
    }

    .nav-links a:hover {
      color: #b88a36;
    }

    .nav-links a:hover::after {
      width: 100%;
    }

    /* =========================
       HEADER BUTTON
    ========================= */

    .header-cta {
      min-width: 150px;
      height: 48px;

      padding: 0 25px;

      display: inline-flex;
      align-items: center;
      justify-content: center;

      background: #b88a36;
      color: white;

      border: 1px solid #b88a36;

      font-size: 11px;
      font-weight: 600;

      letter-spacing: 1.7px;
      text-transform: uppercase;

      transition: all 0.3s ease;
    }

    .header-cta:hover {
      background: transparent;
      color: #b88a36;
    }

    /* =========================
       HERO
    ========================= */

    .hero {
      min-height: 100vh;

      position: relative;

      display: flex;
      align-items: center;

      background-image:
        linear-gradient(
          90deg,
          rgba(18, 17, 15, 0.75),
          rgba(18, 17, 15, 0.25)
        ),
        url("https://images.unsplash.com/photo-1600607687939-ce8a6c25118c?auto=format&fit=crop&w=2400&q=95");

      background-size: cover;
      background-position: center;
    }

    .hero-content {
      width: 88%;
      max-width: 1500px;

      margin: 108px auto 0;

      color: white;
    }

    .eyebrow {
      display: inline-flex;
      align-items: center;
      gap: 12px;

      margin-bottom: 24px;

      font-size: 11px;
      font-weight: 600;

      letter-spacing: 3px;
      text-transform: uppercase;

      color: #d8bd82;
    }

    .eyebrow::before {
      content: "";

      width: 45px;
      height: 1px;

      background: #d8bd82;
    }

    .hero h1 {
      max-width: 850px;

      font-family: "Playfair Display", serif;

      font-size: clamp(54px, 7vw, 105px);

      font-weight: 500;

      line-height: 0.98;

      letter-spacing: -3px;
    }

    .hero h1 span {
      color: #d8bd82;
      font-style: italic;
    }

    .hero-description {
      max-width: 580px;

      margin-top: 32px;

      font-size: 17px;

      color: rgba(255,255,255,0.82);
    }

    .hero-buttons {
      display: flex;
      gap: 15px;

      margin-top: 40px;
    }

    .btn {
      min-height: 54px;

      padding: 0 28px;

      display: inline-flex;
      align-items: center;
      justify-content: center;

      font-size: 11px;
      font-weight: 600;

      letter-spacing: 1.7px;
      text-transform: uppercase;

      transition: all 0.3s ease;
    }

    .btn-primary {
      background: #c49a4a;
      color: white;

      border: 1px solid #c49a4a;
    }

    .btn-primary:hover {
      background: #a9792d;
    }

    .btn-outline {
      color: white;

      border: 1px solid rgba(255,255,255,0.6);
    }

    .btn-outline:hover {
      background: white;
      color: #25231f;
    }

    /* =========================
       COMMON
    ========================= */

    section {
      padding: 120px 6%;
    }

    .section-container {
      max-width: 1250px;
      margin: auto;
    }

    .
