<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Arun Urban Homes | Premium Interior Design</title>

  <meta
    name="description"
    content="Arun Urban Homes creates refined, elegant and functional interiors for modern homes."
  >

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link
    href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@400;500;600;700&display=swap"
    rel="stylesheet"
  >

  <style>

    /* =========================================================
       RESET
    ========================================================= */

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      font-family: "DM Sans", sans-serif;
      background: #f7f3eb;
      color: #1b1a17;
      overflow-x: hidden;
    }

    img {
      max-width: 100%;
    }

    a {
      text-decoration: none;
      color: inherit;
    }


    /* =========================================================
       HEADER
    ========================================================= */

    header {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 108px;
      z-index: 1000;

      background: rgba(250, 247, 240, 0.97);

      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);

      border-top: 2px solid #c7a15a;
      border-bottom: 1px solid rgba(183, 148, 75, 0.28);
    }

    nav {
      width: 100%;
      max-width: 1500px;
      height: 100%;
      margin: auto;

      padding: 0 5.5%;

      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 40px;
    }


    /* =========================================================
       LOGO
    ========================================================= */

    .logo {
      width: 185px;
      height: 96px;

      display: flex;
      align-items: center;
      justify-content: flex-start;

      overflow: hidden;
      flex-shrink: 0;
    }

    .logo img {
      width: 185px;
      height: 185px;

      object-fit: contain;
      display: block;

      transform: scale(1.18);
      transform-origin: center;

      mix-blend-mode: multiply;

      transition: transform 0.4s ease;
    }

    .logo:hover img {
      transform: scale(1.22);
    }


    /* =========================================================
       NAVIGATION LINKS
    ========================================================= */

    .nav-links {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 42px;

      list-style: none;

      margin-left: auto;
      margin-right: auto;
    }

    .nav-links a {
      position: relative;

      font-size: 12px;
      font-weight: 600;

      letter-spacing: 1.8px;
      text-transform: uppercase;

      color: #24221e;

      transition: color 0.3s ease;
    }

    .nav-links a::after {
      content: "";

      position: absolute;

      left: 0;
      bottom: -9px;

      width: 0;
      height: 1px;

      background: #b48a3e;

      transition: width 0.3s ease;
    }

    .nav-links a:hover {
      color: #a77c31;
    }

    .nav-links a:hover::after {
      width: 100%;
    }


    /* =========================================================
       HEADER CTA
    ========================================================= */

    .header-cta {
      min-width: 150px;
      height: 48px;

      padding: 0 25px;

      display: inline-flex;
      align-items: center;
      justify-content: center;

      background: #b88a36;
      color: white;

      border: 1px solid #b88a36;

      font-size: 11px;
      font-weight: 600;

      letter-spacing: 1.7px;
      text-transform: uppercase;

      transition:
        background 0.3s ease,
        transform 0.3s ease,
        border-color 0.3s ease;
    }

    .header-cta:hover {
      background: #1c1b18;
      border-color: #1c1b18;
      transform: translateY(-2px);
    }


    /* =========================================================
       HERO
    ========================================================= */

    .hero {
      min-height: 100vh;

      position: relative;

      display: flex;
      align-items: flex-end;

      padding-top: 108px;

      background-image:
        linear-gradient(
          90deg,
          rgba(8, 8, 7, 0.82) 0%,
          rgba(8, 8, 7, 0.58) 30%,
          rgba(8, 8, 7, 0.12) 62%,
          rgba(8, 8, 7, 0.04) 100%
        ),
        url("https://images.unsplash.com/photo-1600607687939-ce8a6c25118c?auto=format&fit=crop&w=2400&q=95");

      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
    }

    .hero::after {
      content: "";

      position: absolute;
      inset: auto 0 0 0;

      height: 35%;

      background:
        linear-gradient(
          to top,
          rgba(0,0,0,0.58),
          transparent
        );

      pointer-events: none;
    }


    /* =========================================================
       HERO CONTENT
    ========================================================= */

    .hero-content {
      position: relative;
      z-index: 2;

      width: 100%;
      max-width: 1500px;

      margin: auto;

      padding:
        100px 7% 58px;
    }

    .eyebrow {
      display: flex;
      align-items: center;
      gap: 14px;

      margin-bottom: 22px;

      color: #f2e5c9;

      font-size: 12px;
      font-weight: 600;

      letter-spacing: 4px;
      text-transform: uppercase;
    }

    .eyebrow::before,
    .eyebrow::after {
      content: "";

      width: 42px;
      height: 1px;

      background: #d1aa62;
    }


    .hero h1 {
      max-width: 690px;

      color: white;

      font-family: "Playfair Display", serif;

      font-size: clamp(64px, 7vw, 112px);

      font-weight: 500;

      line-height: 0.91;

      letter-spacing: -4px;
    }

    .hero h1 span {
      color: #d5ad61;
    }


    .hero-description {
      max-width: 560px;

      margin-top: 28px;

      color: rgba(255,255,255,0.9);

      font-size: 17px;
      line-height: 1.7;
    }


    /* =========================================================
       HERO BUTTONS
    ========================================================= */

    .hero-actions {
      display: flex;
      align-items: center;
      gap: 18px;

      margin-top: 34px;
    }

    .btn {
      min-height: 54px;

      padding: 0 30px;

      display: inline-flex;
      align-items: center;
      justify-content: center;

      font-size: 11px;
      font-weight: 600;

      letter-spacing: 1.7px;
      text-transform: uppercase;

      transition:
        transform 0.3s ease,
        background 0.3s ease,
        color 0.3s ease;
    }

    .btn-primary {
      background: #c29a4e;
      color: white;

      border: 1px solid #c29a4e;
    }

    .btn-primary:hover {
      background: #d5ae66;
      transform: translateY(-3px);
    }

    .btn-secondary {
      background: rgba(255,255,255,0.06);
      color: white;

      border: 1px solid rgba(255,255,255,0.8);

      backdrop-filter: blur(8px);
    }

    .btn-secondary:hover {
      background: white;
      color: #1c1b18;

      transform: translateY(-3px);
    }


    /* =========================================================
       HERO BOTTOM DETAILS
    ========================================================= */

    .hero-bottom {
      position: relative;
      z-index: 3;

      display: flex;
      align-items: center;

      gap: 45px;

      margin-top: 52px;
    }

    .hero-detail {
      display: flex;
      flex-direction: column;
      gap: 5px;
    }

    .hero-detail strong {
      color: #d5ad61;

      font-family: "Playfair Display", serif;

      font-size: 34px;
      font-weight: 500;
    }

    .hero-detail small {
      color: rgba(255,255,255,0.8);

      font-size: 10px;
      font-weight: 600;

      letter-spacing: 2px;
      text-transform: uppercase;
    }

    .detail-line {
      width: 1px;
      height: 48px;

      background: rgba(220,190,130,0.55);
    }


    /* =========================================================
       INTRO SECTION
    ========================================================= */

    .intro {
      padding: 150px 7%;

      background: #f7f3eb;
    }

    .intro-inner {
      max-width: 1250px;
      margin: auto;

      display: grid;
      grid-template-columns: 0.7fr 1.3fr;

      gap: 100px;
      align-items: start;
    }

    .section-label {
      color: #a57a32;

      font-size: 11px;
      font-weight: 700;

      letter-spacing: 3px;
      text-transform: uppercase;
    }

    .intro h2 {
      max-width: 850px;

      font-family: "Playfair Display", serif;

      font-size: clamp(44px, 5vw, 72px);

      line-height: 1.02;

      font-weight: 500;

      color: #1b1a17;
    }

    .intro p {
      margin-top: 30px;

      max-width: 650px;

      color: #625e56;

      font-size: 17px;

      line-height: 1.8;
    }


    /* =========================================================
       SERVICES
    ========================================================= */

    .services {
      padding: 120px 7%;

      background: #eee9df;
    }

    .section-heading {
      max-width: 1250px;
      margin: auto;

      display: flex;
      justify-content: space-between;
      align-items: flex-end;

      margin-bottom: 60px;
    }

    .section-heading h2 {
      margin-top: 14px;

      font-family: "Playfair Display", serif;

      font-size: clamp(44px, 5vw, 70px);

      font-weight: 500;

      line-height: 1;
    }

    .services-grid {
      max-width: 1250px;
      margin: auto;

      display: grid;
      grid-template-columns: repeat(3, 1fr);

      border-top: 1px solid rgba(30,30,25,0.2);
      border-left: 1px solid rgba(30,30,25,0.2);
    }

    .service {
      min-height: 260px;

      padding: 42px;

      border-right: 1px solid rgba(30,30,25,0.2);
      border-bottom: 1px solid rgba(30,30,25,0.2);

      transition:
        background 0.3s ease,
        transform 0.3s ease;
    }

    .service:hover {
      background: #f7f3eb;
      transform: translateY(-4px);
    }

    .service-number {
      color: #b18a47;

      font-size: 11px;
      font-weight: 700;

      letter-spacing: 2px;
    }

    .service h3 {
      margin-top: 55px;

      font-family: "Playfair Display", serif;

      font-size: 29px;

      font-weight: 500;
    }

    .service p {
      margin-top: 15px;

      color: #6d685f;

      line-height: 1.7;
    }


    /* =========================================================
       PROJECTS
    ========================================================= */

    .projects {
      padding: 140px 7%;

      background: #171613;

      color: white;
    }

    .projects .section-label {
      color: #d3aa5c;
    }

    .projects-heading {
      max-width: 1250px;
      margin: auto;

      margin-bottom: 60px;
    }

    .projects-heading h2 {
      margin-top: 14px;

      max-width: 850px;

      font-family: "Playfair Display", serif;

      font-size: clamp(45px, 5vw, 75px);

      font-weight: 500;

      line-height: 1;
    }

    .project-grid {
      max-width: 1250px;
      margin: auto;

      display: grid;
      grid-template-columns: 1.2fr 0.8fr;

      gap: 24px;
    }

    .project {
      position: relative;

      min-height: 520px;

      overflow: hidden;
    }

    .project.small {
      min-height: 250px;
    }

    .project img {
      width: 100%;
      height: 100%;

      object-fit: cover;

      display: block;

      transition: transform 0.7s ease;
    }

    .project:hover img {
      transform: scale(1.05);
    }

    .project-overlay {
      position: absolute;
      inset: 0;

      display: flex;
      flex-direction: column;
      justify-content: flex-end;

      padding: 38px;

      background:
        linear-gradient(
          to top,
          rgba(0,0,0,0.72),
          transparent 65%
        );
    }

    .project-overlay span {
      color: #d3aa5c;

      font-size: 10px;

      font-weight: 600;

      letter-spacing: 2px;

      text-transform: uppercase;
    }

    .project-overlay h3 {
      margin-top: 8px;

      font-family: "Playfair Display", serif;

      font-size: 34px;

      font-weight: 500;
    }

    .project-side {
      display: grid;
      grid-template-rows: 1fr 1fr;

      gap: 24px;
    }


    /* =========================================================
       PROCESS
    ========================================================= */

    .process {
      padding: 140px 7%;

      background: #f7f3eb;
    }

    .process-inner {
      max-width: 1250px;
      margin: auto;
    }

    .process-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);

      margin-top: 70px;

      border-top: 1px solid rgba(30,30,25,0.2);
    }

    .process-item {
      padding: 40px 28px;

      border-right: 1px solid rgba(30,30,25,0.2);
    }

    .process-item:first-child {
      border-left: 1px solid rgba(30,30,25,0.2);
    }

    .process-item span {
      color: #b18a47;

      font-size: 12px;
      font-weight: 700;

      letter-spacing: 2px;
    }

    .process-item h3 {
      margin-top: 45px;

      font-family: "Playfair Display", serif;

      font-size: 30px;

      font-weight: 500;
    }

    .process-item p {
      margin-top: 15px;

      color: #6b675f;

      line-height: 1.7;
    }


    /* =========================================================
       CTA
    ========================================================= */

    .cta {
      padding: 130px 7%;

      background:
        linear-gradient(
          rgba(20,19,16,0.87),
          rgba(20,19,16,0.87)
        ),
        url("https://images.unsplash.com/photo-1600210492486-724fe5c67fb0?auto=format&fit=crop&w=2200&q=90");

      background-size: cover;
      background-position: center;

      text-align: center;

      color: white;
    }

    .cta .section-label {
      color: #d4ad62;
    }

    .cta h2 {
      max-width: 900px;

      margin: 18px auto 0;

      font-family: "Playfair Display", serif;

      font-size: clamp(48px, 6vw, 82px);

      font-weight: 500;

      line-height: 1;
    }

    .cta p {
      max-width: 600px;

      margin: 28px auto;

      color: rgba(255,255,255,0.78);

      line-height: 1.7;
    }


    /* =========================================================
       FOOTER
    ========================================================= */

    footer {
      padding: 70px 7% 35px;

      background: #11110f;

      color: white;
    }

    .footer-inner {
      max-width: 1250px;
      margin: auto;

      display: grid;
      grid-template-columns: 1.5fr 1fr 1fr;

      gap: 80px;

      padding-bottom: 60px;

      border-bottom: 1px solid rgba(255,255,255,0.12);
    }

    .footer-brand img {
      width: 190px;

      filter: brightness(1.05);
    }

    .footer-brand p {
      max-width: 360px;

      margin-top: 25px;

      color: rgba(255,255,255,0.58);

      line-height: 1.7;
    }

    footer h4 {
      color: #d2a85b;

      font-size: 11px;

      letter-spacing: 2px;

      text-transform: uppercase;
    }

    footer ul {
      list-style: none;

      margin-top: 22px;
    }

    footer li {
      margin-bottom: 12px;

      color: rgba(255,255,255,0.65);
    }

    .copyright {
      max-width: 1250px;
      margin: 25px auto 0;

      color: rgba(255,255,255,0.4);

      font-size: 11px;

      letter-spacing: 0.5px;
    }


    /* =========================================================
       RESPONSIVE
    ========================================================= */

    @media (max-width: 1000px) {

      header {
        height: 90px;
      }

      nav {
        padding: 0 4%;
      }

      .logo {
        width: 145px;
        height: 82px;
      }

      .logo img {
        width: 155px;
        height: 155px;
      }

      .nav-links {
        gap: 22px;
      }

      .header-cta {
        min-width: 125px;
        padding: 0 16px;
      }

      .hero {
        padding-top: 90px;
      }

      .intro-inner {
        grid-template-columns: 1fr;
        gap: 35px;
      }

      .services-grid {
        grid-template-columns: repeat(2, 1fr);
      }

      .process-grid {
        grid-template-columns: repeat(2, 1fr);
      }

      .project-grid {
        grid-template-columns: 1fr;
      }

      .footer-inner {
        grid-template-columns: 1fr 1fr;
      }
    }


    @media (max-width: 700px) {

      header {
        height: 76px;
      }

      nav {
        padding: 0 20px;
      }

      .logo {
        width: 120px;
        height: 70px;
      }

      .logo img {
        width: 135px;
        height: 135px;
      }

      .nav-links {
        display: none;
      }

      .header-cta {
        min-width: 112px;
        height: 40px;

        font-size: 9px;
      }

      .hero {
        min-height: 850px;

        padding-top: 76px;

        background-position: 62% center;
      }

      .hero-content {
        padding: 70px 25px 40px;
      }

      .eyebrow {
        font-size: 9px;
        letter-spacing: 2.5px;
      }

      .hero h1 {
        font-size: clamp(52px, 15vw, 76px);
        letter-spacing: -2px;
      }

      .hero-description {
        font-size: 14px;
      }

      .hero-actions {
        flex-direction: column;
        align-items: stretch;
      }

      .btn {
        width: 100%;
      }

      .hero-bottom {
        gap: 20px;
      }

      .hero-detail strong {
        font-size: 25px;
      }

      .hero-detail small {
        font-size: 8px;
        letter-spacing: 1px;
      }

      .detail-line {
        height: 35px;
      }

      .intro,
      .services,
      .projects,
      .process {
        padding: 90px 25px;
      }

      .services-grid {
        grid-template-columns: 1fr;
      }

      .process-grid {
        grid-template-columns: 1fr;
      }

      .process-item {
        border-left: 1px solid rgba(30,30,25,0.2);
      }

      .project-grid {
        grid-template-columns: 1fr;
      }

      .project {
        min-height: 400px;
      }

      .project-side {
        grid-template-rows: 300px 300px;
      }

      .footer-inner {
        grid-template-columns: 1fr;

        gap: 45px;
      }

      footer {
        padding: 70px 25px 30px;
      }
    }

  </style>
</head>


<body>


  <!-- =======================================================
       HEADER
  ======================================================== -->

  <header>

    <nav>

      <a href="#top" class="logo">
        <img
          src="logo-premium-light.png"
          alt="Arun Urban Homes"
        >
      </a>


      <ul class="nav-links">

        <li>
          <a href="#about">About</a>
        </li>

        <li>
          <a href="#services">Services</a>
        </li>

        <li>
          <a href="#projects">Projects</a>
        </li>

        <li>
          <a href="#process">Process</a>
        </li>

        <li>
          <a href="#contact">Contact</a>
        </li>

      </ul>


      <a href="#contact" class="header-cta">
        Let's Talk →
      </a>

    </nav>

  </header>



  <!-- =======================================================
       HERO
  ======================================================== -->

  <main id="top">

    <section class="hero">

      <div class="hero-content">

        <div class="eyebrow">
          Elevating Everyday Living
        </div>


        <h1>
          Interiors<br>
          that <span>feel</span><br>
          like home.
        </h1>


        <p class="hero-description">
          Thoughtfully designed spaces where
